<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questões Residência - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">QUESTÕES RESIDÊNCIA</h1>

            <!-- Formulário de Login -->
            <div id="loginForm" class="form-container">
                <h2 class="mb-20">Login</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label" for="loginEmail">Email</label>
                        <input
                            type="email"
                            id="loginEmail"
                            class="form-input"
                            required
                            placeholder="seu@email.com"
                        >
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Senha</label>
                        <input
                            type="password"
                            id="loginPassword"
                            class="form-input"
                            required
                            placeholder="********"
                        >
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
                    <div class="login-toggle">
                        <a onclick="mostrarResetSenha()" style="font-size: 14px; display: block; margin-bottom: 10px;">Esqueceu sua senha?</a>
                        Não tem conta?
                        <a onclick="toggleForms()">Registre-se aqui</a>
                    </div>
                </form>
            </div>

            <!-- Formulário de Registro -->
            <div id="registerForm" class="form-container hide">
                <h2 class="mb-20">Criar Conta</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label" for="registerName">Nome Completo</label>
                        <input
                            type="text"
                            id="registerName"
                            class="form-input"
                            required
                            placeholder="Seu nome completo"
                        >
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="registerEmail">Email</label>
                        <input
                            type="email"
                            id="registerEmail"
                            class="form-input"
                            required
                            placeholder="seu@email.com"
                        >
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="registerWhatsapp">WhatsApp</label>
                        <div style="display: flex; gap: 10px;">
                            <select id="whatsappCountryCode" class="form-select" style="flex: 0 0 140px;" onchange="updateWhatsappFields()">
                                <!-- Brasil e EUA primeiro -->
                                <option value="+55" data-ddd-length="2" data-phone-length="9">🇧🇷 Brasil +55</option>
                                <option value="+1" data-ddd-length="3" data-phone-length="7">🇺🇸 EUA/Canadá +1</option>

                                <!-- Separador -->
                                <option disabled>──────────</option>

                                <!-- América do Sul -->
                                <option value="+54" data-ddd-length="2" data-phone-length="8">🇦🇷 Argentina +54</option>
                                <option value="+591" data-ddd-length="0" data-phone-length="8">🇧🇴 Bolívia +591</option>
                                <option value="+56" data-ddd-length="1" data-phone-length="8">🇨🇱 Chile +56</option>
                                <option value="+57" data-ddd-length="1" data-phone-length="10">🇨🇴 Colômbia +57</option>
                                <option value="+593" data-ddd-length="0" data-phone-length="9">🇪🇨 Equador +593</option>
                                <option value="+592" data-ddd-length="0" data-phone-length="7">🇬🇾 Guiana +592</option>
                                <option value="+595" data-ddd-length="0" data-phone-length="9">🇵🇾 Paraguai +595</option>
                                <option value="+51" data-ddd-length="0" data-phone-length="9">🇵🇪 Peru +51</option>
                                <option value="+597" data-ddd-length="0" data-phone-length="7">🇸🇷 Suriname +597</option>
                                <option value="+598" data-ddd-length="0" data-phone-length="8">🇺🇾 Uruguai +598</option>
                                <option value="+58" data-ddd-length="0" data-phone-length="10">🇻🇪 Venezuela +58</option>

                                <!-- América Central e Caribe -->
                                <option value="+52" data-ddd-length="2" data-phone-length="8">🇲🇽 México +52</option>
                                <option value="+53" data-ddd-length="0" data-phone-length="8">🇨🇺 Cuba +53</option>
                                <option value="+507" data-ddd-length="0" data-phone-length="8">🇵🇦 Panamá +507</option>
                                <option value="+506" data-ddd-length="0" data-phone-length="8">🇨🇷 Costa Rica +506</option>
                                <option value="+505" data-ddd-length="0" data-phone-length="8">🇳🇮 Nicarágua +505</option>
                                <option value="+504" data-ddd-length="0" data-phone-length="8">🇭🇳 Honduras +504</option>
                                <option value="+503" data-ddd-length="0" data-phone-length="8">🇸🇻 El Salvador +503</option>
                                <option value="+502" data-ddd-length="0" data-phone-length="8">🇬🇹 Guatemala +502</option>
                                <option value="+501" data-ddd-length="0" data-phone-length="7">🇧🇿 Belize +501</option>
                                <option value="+1809" data-ddd-length="0" data-phone-length="10">🇩🇴 Rep. Dominicana +1809</option>

                                <!-- Europa -->
                                <option value="+351" data-ddd-length="0" data-phone-length="9">🇵🇹 Portugal +351</option>
                                <option value="+34" data-ddd-length="0" data-phone-length="9">🇪🇸 Espanha +34</option>
                                <option value="+33" data-ddd-length="1" data-phone-length="9">🇫🇷 França +33</option>
                                <option value="+49" data-ddd-length="0" data-phone-length="11">🇩🇪 Alemanha +49</option>
                                <option value="+39" data-ddd-length="0" data-phone-length="10">🇮🇹 Itália +39</option>
                                <option value="+44" data-ddd-length="2" data-phone-length="10">🇬🇧 Reino Unido +44</option>
                                <option value="+353" data-ddd-length="0" data-phone-length="9">🇮🇪 Irlanda +353</option>
                                <option value="+41" data-ddd-length="0" data-phone-length="9">🇨🇭 Suíça +41</option>
                                <option value="+43" data-ddd-length="0" data-phone-length="11">🇦🇹 Áustria +43</option>
                                <option value="+32" data-ddd-length="0" data-phone-length="9">🇧🇪 Bélgica +32</option>
                                <option value="+31" data-ddd-length="0" data-phone-length="9">🇳🇱 Holanda +31</option>
                                <option value="+45" data-ddd-length="0" data-phone-length="8">🇩🇰 Dinamarca +45</option>
                                <option value="+46" data-ddd-length="0" data-phone-length="9">🇸🇪 Suécia +46</option>
                                <option value="+47" data-ddd-length="0" data-phone-length="8">🇳🇴 Noruega +47</option>
                                <option value="+358" data-ddd-length="0" data-phone-length="10">🇫🇮 Finlândia +358</option>
                                <option value="+48" data-ddd-length="0" data-phone-length="9">🇵🇱 Polônia +48</option>
                                <option value="+420" data-ddd-length="0" data-phone-length="9">🇨🇿 República Tcheca +420</option>
                                <option value="+30" data-ddd-length="0" data-phone-length="10">🇬🇷 Grécia +30</option>
                                <option value="+7" data-ddd-length="0" data-phone-length="10">🇷🇺 Rússia +7</option>

                                <!-- África -->
                                <option value="+27" data-ddd-length="0" data-phone-length="9">🇿🇦 África do Sul +27</option>
                                <option value="+20" data-ddd-length="0" data-phone-length="10">🇪🇬 Egito +20</option>
                                <option value="+234" data-ddd-length="0" data-phone-length="10">🇳🇬 Nigéria +234</option>
                                <option value="+254" data-ddd-length="0" data-phone-length="10">🇰🇪 Quênia +254</option>
                                <option value="+212" data-ddd-length="0" data-phone-length="9">🇲🇦 Marrocos +212</option>
                                <option value="+258" data-ddd-length="0" data-phone-length="9">🇲🇿 Moçambique +258</option>
                                <option value="+244" data-ddd-length="0" data-phone-length="9">🇦🇴 Angola +244</option>

                                <!-- Ásia -->
                                <option value="+86" data-ddd-length="0" data-phone-length="11">🇨🇳 China +86</option>
                                <option value="+81" data-ddd-length="0" data-phone-length="10">🇯🇵 Japão +81</option>
                                <option value="+82" data-ddd-length="0" data-phone-length="10">🇰🇷 Coreia do Sul +82</option>
                                <option value="+91" data-ddd-length="0" data-phone-length="10">🇮🇳 Índia +91</option>
                                <option value="+92" data-ddd-length="0" data-phone-length="10">🇵🇰 Paquistão +92</option>
                                <option value="+880" data-ddd-length="0" data-phone-length="10">🇧🇩 Bangladesh +880</option>
                                <option value="+66" data-ddd-length="0" data-phone-length="9">🇹🇭 Tailândia +66</option>
                                <option value="+84" data-ddd-length="0" data-phone-length="10">🇻🇳 Vietnã +84</option>
                                <option value="+62" data-ddd-length="0" data-phone-length="11">🇮🇩 Indonésia +62</option>
                                <option value="+60" data-ddd-length="0" data-phone-length="10">🇲🇾 Malásia +60</option>
                                <option value="+65" data-ddd-length="0" data-phone-length="8">🇸🇬 Singapura +65</option>
                                <option value="+63" data-ddd-length="0" data-phone-length="10">🇵🇭 Filipinas +63</option>
                                <option value="+852" data-ddd-length="0" data-phone-length="8">🇭🇰 Hong Kong +852</option>
                                <option value="+886" data-ddd-length="0" data-phone-length="9">🇹🇼 Taiwan +886</option>

                                <!-- Oriente Médio -->
                                <option value="+971" data-ddd-length="0" data-phone-length="9">🇦🇪 Emirados Árabes +971</option>
                                <option value="+966" data-ddd-length="0" data-phone-length="9">🇸🇦 Arábia Saudita +966</option>
                                <option value="+972" data-ddd-length="0" data-phone-length="9">🇮🇱 Israel +972</option>
                                <option value="+90" data-ddd-length="0" data-phone-length="10">🇹🇷 Turquia +90</option>

                                <!-- Oceania -->
                                <option value="+61" data-ddd-length="0" data-phone-length="9">🇦🇺 Austrália +61</option>
                                <option value="+64" data-ddd-length="0" data-phone-length="9">🇳🇿 Nova Zelândia +64</option>
                            </select>
                            <input
                                type="tel"
                                id="whatsappDDD"
                                class="form-input"
                                placeholder="DDD"
                                maxlength="2"
                                style="flex: 0 0 80px;"
                                required
                                pattern="[0-9]{2}"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                            >
                            <input
                                type="tel"
                                id="whatsappNumber"
                                class="form-input"
                                placeholder="Número"
                                maxlength="9"
                                style="flex: 1;"
                                required
                                pattern="[0-9]{8,9}"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                            >
                        </div>
                        <small style="color: var(--text-muted); font-size: 12px; margin-top: 5px; display: block;">
                            <span id="whatsappExample">Exemplo: DDD: 11, Número: 999999999</span>
                        </small>
                    </div>
                    <script>
                        function updateWhatsappFields() {
                            const select = document.getElementById('whatsappCountryCode');
                            const option = select.options[select.selectedIndex];
                            const dddLength = option.getAttribute('data-ddd-length');
                            const phoneLength = option.getAttribute('data-phone-length');

                            const dddInput = document.getElementById('whatsappDDD');
                            const phoneInput = document.getElementById('whatsappNumber');
                            const example = document.getElementById('whatsappExample');

                            if (dddLength === '0') {
                                // Países sem DDD (ex: Portugal)
                                dddInput.style.display = 'none';
                                dddInput.required = false;
                                dddInput.value = '';
                                phoneInput.maxLength = phoneLength;
                                phoneInput.pattern = `[0-9]{${phoneLength}}`;
                                phoneInput.placeholder = 'Número completo';
                                example.textContent = `Exemplo: Número com ${phoneLength} dígitos`;
                            } else {
                                // Países com DDD
                                dddInput.style.display = 'block';
                                dddInput.required = true;
                                dddInput.maxLength = dddLength;
                                dddInput.pattern = `[0-9]{${dddLength}}`;
                                phoneInput.maxLength = phoneLength;
                                phoneInput.pattern = `[0-9]{${phoneLength}}`;
                                phoneInput.placeholder = 'Número';

                                if (select.value === '+55') {
                                    example.textContent = 'Exemplo: DDD: 11, Número: 999999999';
                                } else if (select.value === '+1') {
                                    example.textContent = 'Exemplo: DDD: 212, Número: 5551234';
                                } else {
                                    example.textContent = `Exemplo: DDD com ${dddLength} dígitos, Número com ${phoneLength} dígitos`;
                                }
                            }
                        }

                        // Inicializar campos ao carregar
                        if (document.getElementById('whatsappCountryCode')) {
                            updateWhatsappFields();
                        }
                    </script>
                    <div class="form-group">
                        <label class="form-label" for="registerPassword">Senha</label>
                        <input
                            type="password"
                            id="registerPassword"
                            class="form-input"
                            required
                            minlength="6"
                            placeholder="Mínimo 6 caracteres"
                        >
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="registerPasswordConfirm">Confirmar Senha</label>
                        <input
                            type="password"
                            id="registerPasswordConfirm"
                            class="form-input"
                            required
                            minlength="6"
                            placeholder="Digite a senha novamente"
                        >
                    </div>

                    <!-- Área de status do cadastro -->
                    <div id="signupStatus" class="hide" style="padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 2px solid; text-align: center; font-weight: 600;">
                        <!-- Mensagem preenchida via JavaScript -->
                    </div>

                    <!-- Botão 1: Confirmar Dados -->
                    <button
                        type="button"
                        id="btnConfirmarDados"
                        class="btn btn-primary btn-block"
                        onclick="confirmarDados(event)">
                        ✓ Confirmar Dados
                    </button>

                    <!-- Botão 2: Criar Conta (inicialmente escondido) -->
                    <button
                        type="button"
                        id="btnCriarConta"
                        class="btn btn-primary btn-block hide"
                        onclick="criarContaAuth(event)">
                        🚀 Criar Conta e Entrar
                    </button>

                    <div class="login-toggle">
                        Já tem conta?
                        <a onclick="toggleForms()">Faça login aqui</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal de Reset de Senha -->
    <div id="modalResetSenha" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <h2 style="margin-bottom: 20px;">Recuperar Senha</h2>
            <p style="color: var(--gray-700); margin-bottom: 25px;">
                Digite seu email e enviaremos um link para redefinir sua senha.
            </p>
            <form id="formResetSenha" onsubmit="enviarResetSenha(event)">
                <div class="form-group">
                    <label class="form-label" for="resetEmail">Email</label>
                    <input
                        type="email"
                        id="resetEmail"
                        class="form-input"
                        required
                        placeholder="seu@email.com"
                    >
                </div>
                <div style="display: flex; gap: 12px; margin-top: 25px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        Enviar Link
                    </button>
                    <button type="button" class="btn" onclick="fecharResetSenha()">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
